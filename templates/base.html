<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ESG Score Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-logo">
                🌱 ESG Dashboard
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
                </li>
                <li class="nav-item">
                    <a href="/all-news" class="nav-link {% if request.path == '/all-news' %}active{% endif %}">📰 All
                        News</a>
                </li>
                <li class="nav-item">
                    <a href="/analytics" class="nav-link {% if request.path == '/analytics' %}active{% endif %}">📊
                        Analytics</a>
                </li>
                <li class="nav-item">
                    <a href="/risk-assessment"
                        class="nav-link {% if request.path == '/risk-assessment' %}active{% endif %}">⚠️ Risk
                        Assessment</a>
                </li>
                <li class="nav-item dropdown">
                    <a href="#" class="nav-link">Companies</a>
                    <div class="dropdown-menu">
                        {% for company in companies %}
                        <a href="/company/{{ company }}" class="dropdown-item">{{ company }}</a>
                        {% endfor %}
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>

</html>
