{% extends "base.html" %}

{% block title %}ESG Risk Assessment - ESG Score Dashboard{% endblock %}

{% block content %}
<header>
    <h1>ESG Risk Assessment</h1>
    <p class="subtitle">Company-wide ESG risk status and recommended actions</p>
</header>

<div class="risk-assessment-content">
    <div id="risk-table-container">
        <p class="placeholder">Loading risk assessment data...</p>
    </div>
</div>

<style>
    .risk-assessment-content {
        padding: 20px;
    }

    .risk-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .risk-table thead {
        background: #2c3e50;
        color: white;
    }

    .risk-table th {
        padding: 15px;
        text-align: left;
        font-weight: 600;
        border-bottom: 2px solid #34495e;
    }

    .risk-table td {
        padding: 15px;
        border-bottom: 1px solid #ecf0f1;
    }

    .risk-table tbody tr:hover {
        background: #f8f9fa;
    }

    .risk-table tbody tr:last-child td {
        border-bottom: none;
    }

    .company-link {
        color: #3498db;
        text-decoration: none;
        font-weight: 500;
        cursor: pointer;
    }

    .company-link:hover {
        text-decoration: underline;
    }

    .score {
        font-weight: 600;
        font-size: 1.1em;
    }

    .score-e {
        color: #27ae60;
    }

    .score-s {
        color: #2980b9;
    }

    .score-g {
        color: #e74c3c;
    }

    .overall-score {
        font-weight: 700;
        font-size: 1.2em;
        color: #2c3e50;
    }

    .status-badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.9em;
        text-align: center;
        min-width: 100px;
    }

    .status-badge.healthy {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }

    .status-badge.watchlist {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
    }

    .status-badge.high-risk {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }

    .action-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 0.85em;
        font-weight: 500;
    }

    .action-badge.continuemonitoring {
        background: #d4edda;
        color: #155724;
    }

    .action-badge.investigate {
        background: #fff3cd;
        color: #856404;
    }

    .action-badge.escalate {
        background: #f8d7da;
        color: #721c24;
    }

    .score-breakdown {
        display: flex;
        gap: 15px;
        font-size: 0.9em;
    }

    .score-item {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .score-item label {
        font-size: 0.8em;
        color: #7f8c8d;
        margin-bottom: 4px;
    }

    .score-item .value {
        font-weight: 600;
        font-size: 1.1em;
    }

    @media (max-width: 768px) {
        .risk-table {
            font-size: 0.9em;
        }

        .risk-table th,
        .risk-table td {
            padding: 10px;
        }

        .score-breakdown {
            flex-direction: column;
            gap: 8px;
        }

        .status-badge,
        .action-badge {
            display: block;
            margin: 5px 0;
        }
    }
</style>

<script>
    async function loadRiskAssessment() {
        try {
            const response = await fetch('/api/risk-assessment');
            const data = await response.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            displayRiskAssessment(data);
        } catch (error) {
            console.error('Error loading risk assessment:', error);
            alert('Failed to load risk assessment data');
        }
    }

    function displayRiskAssessment(data) {
        const container = document.getElementById('risk-table-container');

        if (!data.companies || data.companies.length === 0) {
            container.innerHTML = '<p class="placeholder">No companies available</p>';
            return;
        }

        const tableHTML = `
            <table class="risk-table">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Overall Score</th>
                        <th>ESG Breakdown</th>
                        <th>Risk Status</th>
                        <th>Recommended Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.companies.map(company => `
                        <tr>
                            <td>
                                <a href="/company/${company.company.toLowerCase()}" class="company-link">
                                    ${company.company}
                                </a>
                            </td>
                            <td>
                                <span class="overall-score">${company.overall_score.toFixed(2)}</span>
                            </td>
                            <td>
                                <div class="score-breakdown">
                                    <div class="score-item">
                                        <label>E</label>
                                        <span class="value score score-e">${company.environmental_score.toFixed(2)}</span>
                                    </div>
                                    <div class="score-item">
                                        <label>S</label>
                                        <span class="value score score-s">${company.social_score.toFixed(2)}</span>
                                    </div>
                                    <div class="score-item">
                                        <label>G</label>
                                        <span class="value score score-g">${company.governance_score.toFixed(2)}</span>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="status-badge ${company.status_class}">
                                    ${company.risk_status}
                                </span>
                            </td>
                            <td>
                                <span class="action-badge ${company.recommended_action.toLowerCase().replace(' ', '')}">
                                    ${company.recommended_action}
                                </span>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;

        container.innerHTML = tableHTML;
    }

    // Load risk assessment on page load
    loadRiskAssessment();
</script>
{% endblock %}
